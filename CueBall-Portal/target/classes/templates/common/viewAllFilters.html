<div xmlns:th="http://www.thymeleaf.org" th:fragment="viewAllFilters" class="widget" id="viewAllFilters">
    <!--Getting language for filter-->
    <div class="form-group row">
        <!--    This is for load of language-->
        <div th:if="${extraFilters}" class="col-4">
            <div th:replace="common/GenericAllFilters::GenericAllFilters"></div>
        </div>

        <div class="col-4">
            <label for="example-month-input2" class="col-12 col-form-label">Select Enable</label>
            <select class="form-select col-12" id="example-month-input2" th:id="isEnable" th:for="isEnable" th:onchange="|page(${pageNumber},${pageSize})|">
                <option  th:selected th:value="0">Choose...</option>
                <option  th:value="1">True</option>
                <option  th:value="2">False</option>
            </select>
        </div>
        <div class="col-4">
            <label for="example-month-input2" class="col-12 col-form-label" > Search Here</label>
            <input type="text" class="form-control" th:id="search" placeholder="Enter Search" th:onkeypress="|javascript: if(event.keyCode == 13) page(${pageNumber},${pageSize});|"  />
        </div>

        <div class="col-4">
            <div></div>
        </div>

    </div>
    <!--Getting language for filter-->
</div>
