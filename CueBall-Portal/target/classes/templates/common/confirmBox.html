<script xmlns:th="http://www.thymeleaf.org" th:fragment="confirmBox" th:inline="javascript">
    var message =/*[[${message}]]*/ '';
    var error =/*[[${error}]]*/ '';
    $( document ).ready(function() {

        if(message != null) {
            if (error != true){
                Swal.fire({
                    position: 'top-end',
                    icon: 'success',
                    title: message,
                    showConfirmButton: false,
                    timer: 1500
                })
            }
            else {
                Swal.fire({
                    position: 'top-end',
                    icon: 'error',
                    title: message,
                    showConfirmButton: false,
                    timer: 1500
                })
            }
        }
    });
</script>
