<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" th:replace="layout/layout::layout(~{::section})">
    <section class="addPage__section">
        <div id="main-wrapper">
            <!-- Page wrapper  -->
            <div class="page-wrapper">
                <div class="container-fluid">
                    <!-- Bread crumb and right sidebar toggle -->
                    <div class="row page-titles">
                        <div class="col-md-5 align-self-center">
                            <h4 class="text-themecolor">Add more</h4>
                        </div>
                        <div class="col-md-7 align-self-center text-end">
                            <div class="d-flex justify-content-end align-items-center">
                                <ol class="breadcrumb justify-content-end">
                                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/game/viewAll}">List</a></li>
                                    <li sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" class="breadcrumb-item active" th:href="@{/room/addUpdate}">Add</li>

                                </ol>

                            </div>
                        </div>
                    </div>
                    <!-- Bread crumb and right sidebar toggle -->

                    <!-- Start Page Content -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title">Game Form</h4>
                                    <form class="form-horizontal row"  th:object="${dto}" method="post" th:action="@{/game/addUpdate}">

                                        <input  th:field="*{id}" type="hidden">

                                        <!-- Title-->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="title">Title</label>
                                            <div class="col-12">
                                                <input type="text" class="form-control" id="title" placeholder="Enter Name"  th:field="*{title}" />
                                                <div th:each="err : ${#fields.errors('title')}"
                                                     th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>

                                        <!-- Charges -->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="charges">Charges</label>
                                            <div class="col-12">
                                                <input type="text" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" class="form-control" id="charges" placeholder="Enter Charges"  th:field="*{charges}" />
                                                <div th:each="err : ${#fields.errors('charges')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                       </div>

                                        <!-- Additional Charges -->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="maxPlayers">Max Players</label>
                                            <div class="col-12">
                                                <input type="text" oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/(\..*)\./g, '$1');" class="form-control" id="maxPlayers" placeholder="Enter Max Players "  th:field="*{maxPlayers}" />
                                                <div th:each="err : ${#fields.errors('maxPlayers')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>




                                        <div class="row">
                                            <!-- Enable -->
                                            <div class="form-group col-3">
                                            <div class="col-12">
                                                <label>Enable</label>
                                                <div class="form-check form-switch px-0">
                                                    <input type="checkbox" class="js-switch" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{enable}" checked/>
                                                </div>
                                                <div style="list-style: none" th:each="err : ${#fields.errors('enable')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                            </div>


                                        </div>
                                        <input type="hidden" class="form-control" th:field="*{createdDate}"/>

                                        <div class="form-group">
                                            <div >
                                                <button class="btn btn-primary text-white" type="submit">Submit</button>
                                            </div>
                                        </div>

                                    </form>

                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- End PAge Content -->
                </div>
            </div>
            <!-- Page wrapper  -->
        </div>
    </section>
</div>
<script xmlns:th="http://www.thymeleaf.org" th:inline="javascript">

    $(document).ready(function () {

    });
</script>
