<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" th:replace="layout/layout::layout(~{::section})">
    <section class="addPage__section">
        <div id="main-wrapper">
            <!-- Page wrapper  -->
            <div class="page-wrapper">
                <div class="container-fluid">
                    <!-- Bread crumb and right sidebar toggle -->
                    <div class="row page-titles">
                        <div class="col-md-5 align-self-center">
                            <h4 class="text-themecolor">Add more</h4>
                        </div>
                        <div class="col-md-7 align-self-center text-end">
                            <div class="d-flex justify-content-end align-items-center">
                                <ol class="breadcrumb justify-content-end">
                                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/variant/viewAll}">List</a></li>
                                    <li sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" class="breadcrumb-item active" th:href="@{/variant/addUpdate}">Add</li>

                                </ol>
                            </div>
                        </div>
                    </div>
                    <!-- Bread crumb and right sidebar toggle -->
                    <!-- Start Page Content -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title">Variant Form</h4>
                                    <form class="form-horizontal row"  th:object="${dto}" method="post" th:action="@{/variant/addUpdate}">

                                        <input  th:field="*{id}" type="hidden">

                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="name">Name</label>
                                            <div class="col-12">
                                                <input type="text" class="form-control" id="name" placeholder="Enter Name"  th:field="*{name}" />
                                                <div th:each="err : ${#fields.errors('name')}"
                                                     th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>


                                        <!--  Enable / Disable  -->
                                        <div class="form-group col-6">
                                            <div class="col-2">
                                                <label>Enable</label>
                                                <div class="form-check form-switch px-0">
                                                    <input type="checkbox" class="js-switch" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{enable}" checked/>
                                                </div>
                                            </div>

                                        </div>

                                        <!--  Delete  -->
                                        <div class="form-group col-6">
                                            <div class="col-2">
                                                <label>Delete</label>
                                                <div class="form-check form-switch px-0">
                                                    <input type="checkbox" class="js-switch" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{delete}" checked/>
                                                </div>
                                            </div>

                                        </div>


                                        <input type="hidden" class="form-control" th:field="*{createdDate}"/>

                                        <div class="form-group">
                                            <div >
                                                <button id="btn-submit" class="btn btn-primary text-white" type="submit">Submit</button>
                                            </div>
                                        </div>
                                    </form>


                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- End PAge Content -->
                </div>
            </div>
            <!-- Page wrapper  -->
        </div>
    </section>
</div>

<script xmlns:th="http://www.thymeleaf.org" th:inline="javascript">

</script>
