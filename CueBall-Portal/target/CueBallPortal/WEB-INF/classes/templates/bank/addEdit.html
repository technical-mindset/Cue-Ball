<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" th:replace="layout/layout::layout(~{::section})">
    <section class="addPage__section">
        <div id="main-wrapper">
            <!-- Page wrapper  -->
            <div class="page-wrapper">
                <div class="container-fluid">
                    <!-- Bread crumb and right sidebar toggle -->
                    <div class="row page-titles">
                        <div class="col-md-5 align-self-center">
                            <h4 class="text-themecolor">Add more</h4>
                        </div>
                        <div class="col-md-7 align-self-center text-end">
                            <div class="d-flex justify-content-end align-items-center">
                                <ol class="breadcrumb justify-content-end">
                                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/bank/viewAll}">List</a></li>
                                    <li sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" class="breadcrumb-item active" th:href="@{/bank/addUpdate}">Add</li>

                                </ol>

                            </div>
                        </div>
                    </div>
                    <!-- Bread crumb and right sidebar toggle -->

                    <!-- Start Page Content -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title">Bank Form</h4>
                                    <form class="form-horizontal row"  th:object="${dto}" method="post" th:action="@{/bank/addUpdate}">

                                        <input  th:field="*{id}" type="hidden">

                                        <!-- Title-->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="name">Title</label>
                                            <div class="col-12">
                                                <input type="text" class="form-control" id="title" placeholder="Enter Name"  th:field="*{title}" />
                                                <div th:each="err : ${#fields.errors('title')}"
                                                     th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>

                                        <!-- Name-->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="name">Name</label>
                                            <div class="col-12">
                                                <input type="text" class="form-control" id="name" placeholder="Enter Name"  th:field="*{name}" />
                                                <div th:each="err : ${#fields.errors('name')}"
                                                     th:text="${err}" class="error text-danger"/>
                                            </div>
                                       </div>

                                        <!--  Currencies  -->
                                        <div class="form-group col-6">
                                            <label  class="control-label required-field" >Select Currencies</label>
                                            <div class="col-12">
                                                <select id="currency" class="js-example-basic-multiple2 form-control" th:field="*{currencyId}"  multiple="multiple">
                                                    <option th:each="currency : ${currencies}" th:value="${currency.id}" th:text="${currency.currencyCode}"></option>
                                                </select>
                                                <div th:each="err : ${#fields.errors('currencyId')}" th:text="${err}" class="error text-danger"></div>
                                            </div>
                                        </div>

                                        <!--  Vendors  -->
                                        <div class="form-group col-6">
                                            <label  class="control-label required-field" >Select Vendors</label>
                                            <div class="col-12">
                                                <select id="vendors" class="js-example-basic-multiple3 form-control" th:field="*{vendors}"  multiple="multiple">
                                                    <option th:each="vendor : ${vendors}" th:value="${vendor}" th:text="${vendor}"></option>
                                                </select>
                                                <div th:each="err : ${#fields.errors('vendors')}" th:text="${err}" class="error text-danger"></div>
                                            </div>
                                        </div>

                                        <!--  Formula Type  -->
                                        <div class="form-group col-6">
                                            <label  class="control-label required-field" >Select Formula Type</label>
                                            <div class="col-12">
                                                <select id="formulaType" th:id="formulaType" class="js-example-basic-multiple4 form-control" th:field="*{formulaType}" >
                                                    <option th:each="formulaTyp : ${formulaType}" th:value="${formulaTyp}" th:text="${formulaTyp}"></option>
                                                </select>
                                                <div th:each="err : ${#fields.errors('formulaType')}" th:text="${err}" class="error text-danger"></div>
                                            </div>
                                        </div>


                                        <!-- Charges -->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="charges">Charges</label>
                                            <div class="col-12">
                                                <input type="text" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" class="form-control" id="charges" placeholder="Enter Charges"  th:field="*{charges}" />
                                                <div th:each="err : ${#fields.errors('charges')}"
                                                     th:text="${err}" class="error text-danger"/>
                                            </div>
                                       </div>

                                        <!-- Additional Charges -->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="additionalCharges">Additional Charges</label>
                                            <div class="col-12">
                                                <input type="text" oninput="this.value = this.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');" class="form-control" id="additionalCharges" placeholder="Enter Additional Charges"  th:field="*{additionalCharges}" />
                                                <div th:each="err : ${#fields.errors('additionalCharges')}"
                                                     th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>

                                        <!-- Image Url -->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="name">Image Url</label>
                                            <div class="col-12">
                                                <input type="text" class="form-control" id="imageUrl" placeholder="Enter Image Url"  th:field="*{imageUrl}" />
                                                <div th:each="err : ${#fields.errors('imageUrl')}"
                                                     th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>


                                        <div class="row">
                                            <!-- Enable -->
                                            <div class="form-group col-3">
                                            <div class="col-12">
                                                <label>Enable</label>
                                                <div class="form-check form-switch px-0">
                                                    <input type="checkbox" class="js-switch" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{enable}" checked/>
                                                </div>
                                                <div style="list-style: none" th:each="err : ${#fields.errors('enable')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                            </div>

                                            <!-- Exchangable -->
                                            <div class="form-group col-4">
                                            <div class="col-12">
                                                <label>Exchangable</label>
                                                <div class="form-check form-switch px-0">
                                                    <input type="checkbox" class="js-switch" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{exchangable}" checked/>
                                                </div>
                                                <div style="list-style: none" th:each="err : ${#fields.errors('exchangable')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                            </div>


                                        </div>
                                        <input type="hidden" class="form-control" th:field="*{createdDate}"/>

                                        <div class="form-group">
                                            <div >
                                                <button class="btn btn-primary text-white" type="submit">Submit</button>
                                            </div>
                                        </div>

                                    </form>

                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- End PAge Content -->
                </div>
            </div>
            <!-- Page wrapper  -->
        </div>
    </section>
</div>
<script xmlns:th="http://www.thymeleaf.org" th:inline="javascript">

    $(document).ready(function () {
        $('.js-example-basic-multiple2').select2({
            placeholder: 'Select Currencies',
            allowClear:true
        });

        $('.js-example-basic-multiple3').select2({
            placeholder: 'Select Vendors',
            allowClear:true
        });

        setMultiSelectValue([[${dto.currencyId}]],'.js-example-basic-multiple2');
        setMultiSelectValue([[${dto.vendors}]],'.js-example-basic-multiple3');
    });
</script>
