<div xmlns:th="http://www.thymeleaf.org" th:replace="layout/layout::layout(~{::section})">


    <section class="addPage__section">
        <div id="main-wrapper">
            <!-- Page wrapper  -->
            <div class="page-wrapper">
                <div class="container-fluid">
                    <!-- Bread crumb and right sidebar toggle -->
                    <div class="row page-titles">
                        <div class="col-md-5 align-self-center">
                            <h4 class="text-themecolor">Add more</h4>
                        </div>
                        <div class="col-md-7 align-self-center text-end">
                            <div class="d-flex justify-content-end align-items-center">
                                <ol class="breadcrumb justify-content-end">
                                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/users/viewAll}">List</a></li>
                                    <li class="breadcrumb-item active" th:href="@{/users/addUpdate}">Add more</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                    <!-- Bread crumb and right sidebar toggle -->
                    <!-- Start Page Content -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title">Users Form</h4>
                                    <form class="form-horizontal"  th:object="${dto}" method="post" th:action="@{/users/addUpdate}">
                                        <input  th:field="*{id}" type="hidden">
                                        <div class="row">

                                            <!-- User Name-->
                                            <div class="col-6">
                                                <div class="form-group">
                                                    <label class="control-label required-field" for="username">User Name:</label>
                                                    <input type="text" class="form-control" id="username" placeholder="Enter User Name"  th:field="*{username}" />
                                                    <div th:each="err : ${#fields.errors('username')}" th:text="${err}" class="error text-danger"></div>

                                                </div>
                                            </div>

                                            <!-- Full Name-->
                                            <div class="col-6">
                                                <div class="form-group">
                                                    <label class="control-label required-field" for="fullname">Full Name:</label>
                                                    <input type="text" class="form-control" id="fullname" placeholder="Enter Full Name"  th:field="*{fullname}" />
                                                    <div th:each="err : ${#fields.errors('fullname')}" th:text="${err}" class="error text-danger"></div>

                                                </div>
                                            </div>

                                            <!-- Password -->
                                            <div class="col-6">
                                                <div class="form-group">
                                                    <label class="control-label required-field" for="password">Password:</label>
                                                    <input type="text" class="form-control" id="password" placeholder="Enter Password" th:field="*{password}" />
                                                    <div th:each="err : ${#fields.errors('password')}" th:text="${err}" class="error text-danger"></div>

                                                </div>
                                            </div>

                                            <!--  User Roles  -->
                                            <div class="form-group col-6">
                                                <label  class="control-label required-field" >Select Roles</label>
                                                <div class="col-12">
                                                    <select  class="js-example-basic-multiple form-control" th:field="*{roleId}"  multiple="multiple">
                                                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                                                    </select>
                                                    <div th:each="err : ${#fields.errors('roleId')}" th:text="${err}" class="error text-danger"></div>
                                                </div>
                                            </div>

<!--                                            &lt;!&ndash;  Operating Unit  &ndash;&gt;-->
<!--                                            <div class="form-group col-6">-->
<!--                                                <label  class="control-label required-field" >Select Operating Units</label>-->
<!--                                                <div class="col-12">-->
<!--                                                    <select  class="js-example-basic-single  form-control"  th:field="*{operatingUnitId}" multiple="multiple">-->
<!--&lt;!&ndash;                                                        <option th:value="0" th:selected="${operatingUnitId == null}">Choose...</option>&ndash;&gt;-->
<!--                                                        <option th:each="operatingUnit : ${operatingUnits}" th:value="${operatingUnit.id}" th:text="${operatingUnit.title}"></option>-->
<!--                                                    </select>-->
<!--                                                    <div th:each="err : ${#fields.errors('operatingUnitId')}" th:text="${err}" class="error text-danger"/>-->
<!--                                                </div>-->
<!--                                            </div>-->


                                            <!--   Enable    -->
                                            <div class="form-group row">
                                                <div class="col-2">
                                                    <label>Enable</label>
                                                    <div class="form-check form-switch px-0">
                                                        <input type="checkbox" class="js-switch" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{enable}" checked/>
                                                    </div>
                                                </div>
                                            </div>

                                            <input type="hidden" class="form-control" th:field="*{createdDate}"/>

                                            <div class="form-group">
                                                <div >
                                                    <button class="btn btn-primary text-white" type="submit">Submit</button>
                                                </div>
                                            </div>
                                        </div>
                                    </form>


                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- End PAge Content -->
                </div>
            </div>
            <!-- Page wrapper  -->
        </div>
    </section>
</div>


<script xmlns:th="http://www.thymeleaf.org" th:inline="javascript">

    $(document).ready(function () {
        $('.js-example-basic-multiple').select2({
            placeholder: 'Select Roles',
            allowClear:true
        });

        setMultiSelectValue([[${dto.roleId}]],'.js-example-basic-multiple');
    });

</script>
