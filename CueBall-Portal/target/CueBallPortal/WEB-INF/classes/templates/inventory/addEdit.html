<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" th:replace="layout/layout::layout(~{::section})">
    <section class="addPage__section">
        <div id="main-wrapper">
            <!-- Page wrapper  -->
            <div class="page-wrapper">
                <div class="container-fluid">
                    <!-- Bread crumb and right sidebar toggle -->
                    <div class="row page-titles">
                        <div class="col-md-5 align-self-center">
                            <h4 class="text-themecolor">Add more</h4>
                        </div>
                        <div class="col-md-7 align-self-center text-end">
                            <div class="d-flex justify-content-end align-items-center">
                                <ol class="breadcrumb justify-content-end">
                                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/inventory/viewAll}">List</a></li>
                                    <li sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" class="breadcrumb-item active" th:href="@{/inventory/addUpdate}">Add</li>

                                </ol>

                            </div>
                        </div>
                    </div>
                    <!-- Bread crumb and right sidebar toggle -->

                    <!-- Start Page Content -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title">Inventory Form</h4>
                                    <form class="form-horizontal row"  th:object="${dto}" method="post" th:action="@{/inventory/addUpdate}">

                                        <input  th:field="*{id}" type="hidden">

                                        <!-- Name-->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="name">Name</label>
                                            <div class="col-12">
                                                <input type="text" class="form-control" id="name" placeholder="Enter Name"  th:field="*{name}" />
                                                <div th:each="err : ${#fields.errors('name')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>

                                        <!-- Quantity-->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="quantity">Quantity</label>
                                            <div class="col-12">
                                                <input type="text" class="form-control" id="quantity" placeholder="Enter Quantity"  th:field="*{quantity}" />
                                                <div th:each="err : ${#fields.errors('quantity')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>

                                        <!-- Quantity-->
                                        <div class="form-group col-6">
                                            <label class="control-label required-field" for="price">Price</label>
                                            <div class="col-12">
                                                <input type="text" class="form-control" id="price" placeholder="Enter Price"  th:field="*{price}" />
                                                <div th:each="err : ${#fields.errors('price')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>


                                        <!-- Inventory Category -->
                                        <div class="form-group col-6">
                                            <label  class="control-label col-sm-4 required-field" >Inventory Category</label>
                                            <div class="col-12">
                                                <select  class="form-control"  th:field="*{inventoryCategoryId}">
                                                    <option th:value="0" th:selected="${inventoryCategoryId == null}">Choose...</option>
                                                    <option th:each="inventoryCategory : ${inventoryCategoryList}" th:value="${inventoryCategory.id}" th:text="${inventoryCategory.name}"></option>
                                                </select>
                                                <div th:each="err : ${#fields.errors('inventoryCategoryId')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>


                                        <!-- Variant -->
                                        <div class="form-group col-6">
                                            <label  class="control-label col-sm-4 required-field" >Variant</label>
                                            <div class="col-12">
                                                <select  class="form-control"  th:field="*{variant}">
                                                    <option th:value="0" th:selected="${variant == null}">Choose...</option>
                                                    <option th:each="v : ${variants}" th:value="${v}" th:text="${v}"></option>
                                                </select>
                                                <div th:each="err : ${#fields.errors('variant')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                        </div>




                                        <div class="row">
                                            <!-- Enable -->
                                            <div class="form-group col-3">
                                            <div class="col-12">
                                                <label>Enable</label>
                                                <div class="form-check form-switch px-0">
                                                    <input type="checkbox" class="js-switch" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{enable}" checked/>
                                                </div>
                                                <div style="list-style: none" th:each="err : ${#fields.errors('enable')}" th:text="${err}" class="error text-danger"/>
                                            </div>
                                            </div>


                                        </div>
                                        <input type="hidden" class="form-control" th:field="*{createdDate}"/>

                                        <div class="form-group">
                                            <div >
                                                <button class="btn btn-primary text-white" type="submit">Submit</button>
                                            </div>
                                        </div>

                                    </form>

                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- End PAge Content -->
                </div>
            </div>
            <!-- Page wrapper  -->
        </div>
    </section>
</div>
<script xmlns:th="http://www.thymeleaf.org" th:inline="javascript">

</script>
