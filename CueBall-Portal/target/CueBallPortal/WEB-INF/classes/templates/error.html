<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="https://www.dawateislami.net/img/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawateislami</title>
</head>
<style>
    .section{
        padding: 4rem 2rem;
        width: fit-content;
        margin: 0px auto;
        text-align: center;
    }

    .section .error{
        font-size: 150px;
        color: #04a791;
        text-shadow: 1px 1px 1px #136a5e, 2px 2px 1px #136a5e, 3px 3px 1px #136a5e, 4px 4px 1px #136a5e, 5px 5px 1px #136a5e, 6px 6px 1px #136a5e, 7px 7px 1px #136a5e, 8px 8px 1px #136a5e, 25px 25px 8px rgb(0 0 0 / 0%);
    }

    .page{
        margin: 2rem 0;
        font-size: 20px;
        font-weight: 600;
        color: #444;
    }

    .back-home{
        display: inline-block;
        border: 2px solid #3b3b79;
        color: #3b3b79;
        text-transform: uppercase;
        font-weight: 600;
        padding: 0.75rem 1rem 0.6rem;
        transition: all 0.2s linear;
        box-shadow: 0 3px 8px rgba(0,0,0, 0.3);
        text-decoration: none;
    }
    .back-home:hover{
        background: #3b3b79;
        color: #ddd;
    }
</style>
<body>
<div class="section" xmlns:th="http://www.thymeleaf.org">
    <h1 class="error">404</h1>
    <div class="page">Ooops!!! The page you are looking for is not found</div>
    <a class="back-home" th:href="@{|/dashboard|}">Back to home</a>
</div>
</body>
</html>
