<div xmlns:th="*" xmlns:sec="http://www.w3.org/1999/xhtml" th:replace="layout/layout::layout(~{::section})">
<section class="dash__board">
    <!-- Page wrapper  -->
    <div class="page-wrapper">
        <!-- Container fluid  -->
        <div class="container-fluid">
            <!-- Bread crumb and right sidebar toggle -->
            <div class="row page-titles">
                <div class="col-md-5 align-self-center">
                    <h4 class="text-themecolor">Dashboard</h4>
                </div>
                <div class="col-md-7 align-self-center text-end">
                    <div class="d-flex justify-content-end align-items-center">
                        <ol class="breadcrumb justify-content-end">
<!--                            <li class="breadcrumb-item"><a href="javascript:void(0)">Home</a></li>-->
                        </ol>
                    </div>
                </div>
            </div>
            <!-- Bread crumb and right sidebar toggle -->
            <!-- Page Content -->
            <div class="row ">
                <!-- Column -->

                <div sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" class="col-lg-4 col-md-4 col-4 text-center ">
                    <div class="card dashboard_card_custom">
                        <a th:href="@{/legalentity/viewAll}">
                            <div class="card-body">
                                <div class="row p-t-10 p-b-10">
                                    <!-- Column -->
                                    <div class="col p-r-0">
                                        <h2 class="m-0"> Legal Entity </h2>
                                        <h2 class="m-0" th:text="${legalEntityCount}"></h2>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="col-lg-4 col-md-4 col-4 text-center ">
                    <div class="card dashboard_card_custom">
                        <a th:href="@{/operatingunit/viewAll}">
                            <div class="card-body">
                                <div class="row p-t-10 p-b-10">
                                    <!-- Column -->
                                    <div class="col p-r-0">
                                        <h2 class="m-0"> Operating Unit </h2>
                                        <h2 class="m-0" th:text="${operatingUnitCount}"></h2>
                                    </div>
                                </div>
                            </div>

                        </a>
                    </div>
                </div>

                <div class="col-lg-4 col-md-4 col-4 text-center ">
                    <div class="card dashboard_card_custom">
                        <a th:href="@{/campaign/viewAll}">
                            <div class="card-body">
                                <div class="row p-t-10 p-b-10">
                                    <!-- Column -->
                                    <div class="col p-r-0">
                                        <h2 class="m-0"> Campaign </h2>
                                        <h2 class="m-0" th:text="${campaignCount}"></h2>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="col-lg-4 col-md-4 col-4 text-center ">
                    <div class="card dashboard_card_custom">
                        <a th:href="@{/currency/viewAll}">
                            <div class="card-body">
                                <div class="row p-t-10 p-b-10">
                                    <!-- Column -->
                                    <div class="col p-r-0">
                                        <h2 class="m-0"> Currency </h2>
                                        <h2 class="m-0" th:text="${currencyCount}"></h2>
                                    </div>
                                </div>
                            </div>

                        </a>
                    </div>
                </div>

                <div class="col-lg-4 col-md-4 col-4 text-center ">
                    <div class="card dashboard_card_custom">
                        <a th:href="@{/bank/viewAll}">
                            <div class="card-body">
                                <div class="row p-t-10 p-b-10">
                                    <!-- Column -->
                                    <div class="col p-r-0">
                                        <h2 class="m-0"> Bank </h2>
                                        <h2 class="m-0" th:text="${bankCount}"></h2>
                                    </div>
                                </div>
                            </div>

                        </a>
                    </div>
                </div>

                <div class="col-lg-4 col-md-4 col-4 text-center ">
                    <div class="card dashboard_card_custom">
                        <a th:href="@{/transaction/viewAll}">
                            <div class="card-body">
                                <div class="row p-t-10 p-b-10">
                                    <!-- Column -->
                                    <div class="col p-r-0">
                                        <h2 class="m-0"> Transaction </h2>
                                        <h2 class="m-0" th:text="${transactionCount}"></h2>
                                    </div>
                                </div>
                            </div>

                        </a>
                    </div>
                </div>
                <!-- Column -->
            </div>
            <!-- PAge Content -->
        </div>
        <!-- Container fluid  -->
    </div>
    <!-- Page wrapper  -->
</section>
</div>
