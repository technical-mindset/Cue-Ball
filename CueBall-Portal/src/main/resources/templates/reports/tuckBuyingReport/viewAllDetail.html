<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" th:fragment="viewAllDetail" id="viewAllDetail">
    <div class="wg-table table-all-attribute">
        <ul class="table-title flex gap20 mb-14">
            <li>
                <div class="body-title">ID</div>
            </li>
            <li>
                <div class="body-title">Item</div>
            </li>
            <li>
                <div class="body-title">Price</div>
            </li>
            <li>
                <div class="body-title">Quantity</div>
            </li>
            <li>
                <div class="body-title">Buying Date</div>
            </li>
        </ul>
        <ul class="flex flex-column">
            <li class="attribute-item flex items-center justify-between gap20" th:each="data : ${dataList}">
                <div class="body-text" th:text="${data.getId()}"></div>
                <div class="body-text" th:text="${data.inventoryName}"></div>
                <div class="body-text" th:text="${data.price}"></div>
                <div class="body-text" th:text="${data.quantity}"></div>
                <div class="body-text" th:text="${#dates.format(new java.util.Date(data.getCreatedAt()), 'yyyy-MM-dd')}"></div>
            </li>
        </ul>
    </div>
    <div class="divider"></div>
    <div th:replace="common/ajaxPaging::ajaxPaging"></div>

</div>
