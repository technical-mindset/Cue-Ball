<div class="container" xmlns:th="http://www.thymeleaf.org" th:replace="layout/layout::layout(~{::section})">
    <section>
        <section class="addPage__section">
            <div id="main-wrapper">
                <!-- Page wrapper  -->
                <div class="page-wrapper">
                    <div class="container-fluid">
                        <!-- Bread crumb and right sidebar toggle -->
                        <div class="row page-titles">
                            <div class="col-md-5 align-self-center">
                                <h4 class="text-themecolor">Add more</h4>
                            </div>
                            <div class="col-md-7 align-self-center text-end">
                                <div class="d-flex justify-content-end align-items-center">
                                    <ol class="breadcrumb justify-content-end">
                                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                                        <li class="breadcrumb-item"><a th:href="@{/localization/viewAll}">List</a></li>

                                    </ol>
<!--                                    <a th:href="@{/localization/addUpdate}" class="btn btn-info d-none d-lg-block m-l-15 text-white"><i-->
<!--                                            class="ti-plus"></i> Add</a>-->
                                </div>
                            </div>
                        </div>
                        <!-- Bread crumb and right sidebar toggle -->
                        <!-- Start Page Content -->
                        <div class="row">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-body">
                                        <h4 class="card-title">Localization Form</h4>
                                        <!--**************************************************************************form************************************************************************-->
                                        <form th:action="@{/localization/addUpdate}" method="post" th:object="${dto}"
                                               class="needs-validation" novalidate>
                                            <input th:field="*{id}" type="hidden">
                                            <div class="row">
                                                <!--***************************************************************************bannerImage***********************************************************************-->
                                                <div class="form-group col-4">
                                                    <label class="control-label">Section</label>
                                                    <div class="col-12">
                                                        <input type="text" class="form-control" id="section"
                                                               placeholder="Enter section"
                                                               th:field="*{section}" readonly/>

                                                        <div th:each="err : ${#fields.errors('section')}"
                                                             th:text="${err}" class="error text-danger" />

                                                    </div>
                                                </div>

                                                <div class="form-group col-4">
                                                    <label class="control-label ">Key</label>
                                                    <div class="col-12">
                                                        <input type="text" class="form-control" id="key"
                                                               placeholder="Enter key" th:field="*{key}" readonly />
                                                    </div>

                                                    <div th:each="err : ${#fields.errors('key')}"
                                                         th:text="${err}" class="error text-danger"/>

                                                </div>

                                                <div class="form-group col-4">
                                                    <label class="control-label">Language</label>
                                                    <div class="col-12">
                                                        <input type="text" class="form-control" id="language"
                                                               placeholder="Enter Language" th:field="*{langCode}" readonly/>
                                                    </div>

                                                    <div th:each="err : ${#fields.errors('langCode')}"
                                                         th:text="${err}" class="error text-danger"/>

                                                </div>

                                                <div class="form-group col-6">
                                                    <label class="control-label">Local Text</label>
                                                    <div class="col-12">
                                                        <input type="text" class="form-control" id="localText"
                                                                  placeholder="Enter local text" th:field="*{localText}"/>
                                                    </div>

                                                    <div th:each="err : ${#fields.errors('localText')}"
                                                         th:text="${err}" class="error text-danger"/>

                                                </div>


                                                <div class="form-group col-6">
                                                    <label class="control-label">Page Type</label>
                                                    <div class="col-12">
                                                        <input type="text" class="form-control" id="pageType"
                                                               placeholder="Enter page type" th:field="*{pageType}" readonly/>
                                                    </div>

                                                    <div th:each="err : ${#fields.errors('pageType')}"
                                                         th:text="${err}" class="error text-danger"/>

                                                </div>

                                            </div>
                                            <input type="hidden" class="form-control" th:field="*{createdAt}"/>
                                            <div class="form-group">
                                                <div >
                                                    <button class="btn btn-primary text-white" type="submit">Submit</button>
                                                </div>
                                            </div>
                                        </form>
                                        <!--**************************************************************************form************************************************************************-->
                                    </div>
                                </div>
                            </div>

                        </div>


                    </div>
                    <!-- End PAge Content -->
                </div>
            </div>
            <!-- Page wrapper  -->

        </section>


    </section>
</div>
