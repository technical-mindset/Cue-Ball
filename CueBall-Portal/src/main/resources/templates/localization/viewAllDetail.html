<div xmlns:th="http://www.thymeleaf.org" th:fragment="viewAllDetail" class="widget" id="viewAllDetail">
    <!-- Start Page Content -->
    <div class="row">
        <div class="col-12">
            <!-- table responsive -->
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Table Localization </h4>
                    <!--                                    <h6 class="card-subtitle">Data table example</h6>-->
                    <div class="table-responsive m-t-40">
                        <table class="table table-striped" id="detailTable">
                            <thead>
                            <tr>

                                <th>ID</th>
                                <th>Edit</th>
                                <th>Section</th>
                                <th>Key</th>
                                <th>Local Text</th>
                                <th>Page Type</th>
                                <th>Language</th>




                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="data : ${dataList}">
                                <td th:text="${data.getId()}"></td>
                                <td><a th:href="@{|addUpdate/?id=${data.getId()}|}"><i class="ti-pencil"></i></a></td>
                                <td th:text="${data.section}"></td>
                                <td th:text="${data.key}"></td>
                                <td th:text="${data.localText}"></td>
                                <td th:text="${data.pageType}"></td>
                                <td th:text="${data.langCode}"></td>


                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="common/ajaxPaging::ajaxPaging"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- End PAge Content -->

    <script xmlns:th="http://www.thymeleaf.org" th:inline="javascript">
        function onchangeLanguage() {
            var url = [[${baseUrl}]];
            var languageUrl = url + "/localization/viewAll?ajax=true&pn=1&langCode=" + $("#langCode").val();
            $.ajax({
                url: languageUrl,
                success: function (result) {
                    $("#middle-portion").html(result);
                },
            });
        }
    </script>


</div>
