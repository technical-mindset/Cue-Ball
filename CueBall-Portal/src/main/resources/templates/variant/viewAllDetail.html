<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" th:fragment="viewAllDetail"
     class="widget" id="viewAllDetail">
    <!-- Start Page Content -->
    <div class="row">
        <div class="col-12">
            <!-- table responsive -->
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Table Variant</h4>
                    <div class="table-responsive m-t-40">
                        <table class="table table-striped" id="detailTable">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Edit</th>
                                <th>Name</th>
                                <th>Enable</th>
                                <th sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')">Delete</th>
                            </thead>
                            <tbody>


                            <tr th:each="data : ${dataList}">
                                <td th:text="${data.id}"></td>
                                <td><a th:href="@{|/variant/addUpdate/?id=${data.getId()}|}"><i class="ti-pencil"></i></a></td>
                                <td th:text="${data.name}"></td>
                                <td th:text="${data.enable}"></td>
                                <td sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" th:text="${data.delete}"></td>
                            </tr>

                            </tbody>
                        </table>
                    </div>
                    <div th:replace="common/ajaxPaging::ajaxPaging"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- End PAge Content -->
</div>
