<div xmlns:th="http://www.thymeleaf.org" th:fragment="viewAllDetail" id="viewAllDetail">
    <div class="row">
        <div th:each="data : ${dataList}" class="col-xl-2 col-lg-4 col-md-4 col-sm-6 col-12 px-2 my-2">
            <div class="cat-card">
                <a th:href="@{|addUpdate/?id=${data.getId()}|}" th:text="${data.name}">
                </a>
            </div>
        </div>
    </div>
</div>
