<div xmlns:th="" xmlns:sec="http://www.w3.org/1999/xhtml" th:replace="layout/layout::layout(~{::section})">
    <section>
        <div class="flex items-center flex-wrap justify-between gap20 mb-27">
            <h3>Tuck Shop Items</h3>
            <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                <li><a th:href="@{/dashboard}"><div class="text-tiny">Dashboard</div></a></li>
                <li><i class="icon-chevron-right"></i></li>
                <li><div class="text-tiny">Menu</div></li>
            </ul>
        </div>
        <div class="wg-box">
            <div th:replace='tuckShop/tuckShopItemsDetail::tuckShopItemsDetail'></div>
        </div>
        <script th:inline="javascript">

            $(document).ready(function () {
                $("#back").hide();
                $("#checkout").hide();
                $(".checkout-final").hide();
                $("#next").prop("disabled", true);
            })

            // Array to store selected items
            let selectedItems = [];

            function selectItems(id, price , name, element) {
                // Check if item is already selected
                const itemIndex = selectedItems.findIndex(item => item.id === id);

                if (itemIndex !== -1) {
                    // Item already exists, remove it (deselect)
                    selectedItems.splice(itemIndex, 1);
                    element.classList.remove('selected');
                } else {
                    // Add new item to array
                    selectedItems.push({ id: id, actualPrice: price , name : name});
                    element.classList.add('selected');
                }

                // Log the updated array (you can replace this with your logic)
                console.log(selectedItems);

                if(selectedItems.length > 0){
                    $("#next").prop("disabled", false);
                }
                else {
                    $("#next").prop("disabled", true);
                }
                updateCheckoutTable();
            }

            function next() {
                if(selectedItems.length > 0){
                    $("#back").show();
                    $("#checkout").show();
                    $("#next").hide();

                    $(".tuck-items").hide();
                    $(".checkout-final").show();
                }
                else{
                    Swal.fire('Please select an item', '', 'warning');
                }
            }

            function back() {
                $("#back").hide();
                $("#checkout").hide();
                $("#next").show();

                $(".tuck-items").show();
                $(".checkout-final").hide();
            }

            function updateCheckoutTable() {
                const checkoutDiv = document.querySelector('.checkout-final');

                // Calculate total amount
                const totalAmount = selectedItems.reduce((sum, item) => sum + item.actualPrice, 0);

                // Generate table body rows
                const rows = selectedItems.length > 0
                    ? selectedItems.map((item, index) => `
            <li class="attribute-item flex items-center justify-between gap20">
                <div class="body-text">${index + 1}</div>
                <div class="body-text">${item.name}</div>
                <div class="body-text">$${item.actualPrice.toFixed(2)}</div>
            </li>
        `).join('')
                    : '';

                // Create footer row for total
                const footerRow = selectedItems.length > 0
                    ? `
            <li class="attribute-item flex items-center justify-between gap20">
                <div class="body-text"></div>
                <div class="body-text"><strong>Total</strong></div>
                <div class="body-text"><strong>$${totalAmount.toFixed(2)}</strong></div>
            </li>
        `
                    : '';

                // Create the complete HTML structure
                const tableHtml = `
                    <div class="wg-table table-all-attribute">
                        <ul class="table-title flex gap20 mb-14">
                            <li><div class="body-title">S no.</div></li>
                            <li><div class="body-title">Item Name</div></li>
                            <li><div class="body-title">Price</div></li>
                        </ul>
                        <ul class="flex flex-column">
                            ${rows}
                            ${footerRow}
                        </ul>
                    </div>
                `;

                // Update the div content in a single operation
                checkoutDiv.innerHTML = tableHtml;
            }

            function CheckOut() {
                $.ajax({
                    url: 'checkout',
                    type: 'POST',
                    contentType: 'application/json',   // <-- Very Important
                    data: JSON.stringify(selectedItems),  // <-- Send full JSON
                    success: data => {
                        console.log(data);
                        if (data.status == 200){
                            Swal.fire(data.message, '', 'success');
                            swalForTuckShop(data.message);
                        }
                        else{
                            Swal.fire(data.message, '', 'error');
                        }

                    }
                });
            }

           function swalForTuckShop(message){
               Swal.fire({
                   title: message,
                   icon: "success",
                   confirmButtonColor: "#3085d6",
                   cancelButtonColor: "#d33",
                   confirmButtonText: "OK"
               }).then((result) => {
                   if (result.isConfirmed) {
                       window.location.reload();
                   }
               });
           }
        </script>
    </section>
</div>
