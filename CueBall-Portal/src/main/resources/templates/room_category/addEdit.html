<div xmlns:th="http://www.thymeleaf.org" th:replace="layout/layout::layout(~{::section})">


    <section class="addPage__section">
        <div id="main-wrapper">
            <!-- Page wrapper  -->
            <div class="page-wrapper">
                <div class="container-fluid">
                    <!-- Bread crumb and right sidebar toggle -->
                    <div class="row page-titles">
                        <div class="col-md-5 align-self-center">
                            <h4 class="text-themecolor">Add more</h4>
                        </div>
                        <div class="col-md-7 align-self-center text-end">
                            <div class="d-flex justify-content-end align-items-center">
                                <ol class="breadcrumb justify-content-end">
                                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Home</a></li>
                                    <li class="breadcrumb-item"><a th:href="@{/roomCategory/viewAll}">List</a></li>
                                    <li class="breadcrumb-item active" th:href="@{/roomCategory/addUpdate}">Add more</li>
                                </ol>
                            </div>
                        </div>
                    </div>
                    <!-- Bread crumb and right sidebar toggle -->
                    <!-- Start Page Content -->
                    <div class="row">
                        <div class="col-12">
                            <div class="card">
                                <div class="card-body">
                                    <h4 class="card-title">Room Category Form</h4>
                                    <form class="form-horizontal"  th:object="${dto}" method="post" th:action="@{/roomCategory/addUpdate}">
                                        <input  th:field="*{id}" type="hidden">
                                        <div class="row">

                                            <!-- Category Name-->
                                            <div class="col-6">
                                                <div class="form-group">
                                                    <label class="control-label required-field" for="name">User Name:</label>
                                                    <input type="text" class="form-control" id="name" placeholder="Enter Category Name"  th:field="*{name}" />
                                                    <div th:each="err : ${#fields.errors('name')}" th:text="${err}" class="error text-danger"></div>

                                                </div>
                                            </div>


                                            <!--   Enable    -->
                                            <div class="form-group row">
                                                <div class="col-2">
                                                    <label>Enable</label>
                                                    <div class="form-check form-switch px-0">
                                                        <input type="checkbox" class="js-switch" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{enable}" checked/>
                                                    </div>
                                                </div>
                                            </div>

                                            <input type="hidden" class="form-control" th:field="*{createdDate}"/>

                                            <div class="form-group">
                                                <div >
                                                    <button class="btn btn-primary text-white" type="submit">Submit</button>
                                                </div>
                                            </div>
                                        </div>
                                    </form>


                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- End PAge Content -->
                </div>
            </div>
            <!-- Page wrapper  -->
        </div>
    </section>
</div>


<script xmlns:th="http://www.thymeleaf.org" th:inline="javascript">


</script>
