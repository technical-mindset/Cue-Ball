<div xmlns:th="http://www.thymeleaf.org" th:replace="layout/layout::layout(~{::section})">
    <section class="addPage__section">
        <div class="flex items-center flex-wrap justify-between gap20 mb-27">
            <h3>Add User</h3>
            <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                <li><a th:href="@{/dashboard}"><div class="text-tiny">Dashboard</div></a></li>
                <li><i class="icon-chevron-right"></i></li>
                <li><div class="text-tiny"><a th:href="@{/users/viewAll}">List</a></div></li>
                <li><i class="icon-chevron-right"></i></li>
                <li class="active" th:href="@{/users/addUpdate}">Add</li>
            </ul>
        </div>
        <form class="form-add-product" th:object="${dto}" method="post" th:action="@{/users/addUpdate}">
            <div class="wg-box">
                <input  th:field="*{id}" type="hidden">
                <div class="gap22 cols">
                    <fieldset class="userName">
                        <div class="body-title mb-10">User Name <span class="tf-color-1">*</span></div>
                        <input class="mb-10" type="text" placeholder="Enter User Name" tabindex="0" th:field="*{username}" />
                        <div th:each="err : ${#fields.errors('username')}" th:text="${err}" class="error text-danger"></div>
                    </fieldset>
                    <fieldset class="fullName">
                        <div class="body-title mb-10">Full Name <span class="tf-color-1">*</span></div>
                        <input class="mb-10" type="text" placeholder="Enter Full Name"  th:field="*{fullname}" />
                        <div th:each="err : ${#fields.errors('fullname')}" th:text="${err}" class="error text-danger"></div>
                    </fieldset>
                </div>
                <div class="gap22 cols">
                    <fieldset class="password">
                        <div class="body-title mb-10">Password <span class="tf-color-1">*</span></div>
                        <input class="mb-10" type="text" placeholder="Enter Password" th:field="*{password}" />
                        <div th:each="err : ${#fields.errors('password')}" th:text="${err}" class="error text-danger"></div>
                    </fieldset>
                    <fieldset class="games">
                        <div class="body-title mb-10">Select Games <span class="tf-color-1">*</span></div>
                        <div class="select">
                            <select  class="js-example-basic-multiple" th:field="*{roleId}"  multiple="multiple">
                                <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}"></option>
                            </select>
                        </div>
                        <div th:each="err : ${#fields.errors('roleId')}" th:text="${err}" class="error text-danger"></div>
                    </fieldset>
                </div>
                <fieldset class="enable">
                    <div class="body-title mb-10">Enable<span class="tf-color-1">*</span></div>
                    <input class="mb-10 js-switch" tabindex="0" type="checkbox" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{enable}" checked>
                    <div style="list-style: none" th:each="err : ${#fields.errors('enable')}" th:text="${err}" class="error text-danger"/>
                </fieldset>
                <input type="hidden" class="form-control" th:field="*{createdAt}"/>
                <div class="">
                    <button class="tf-button w208" type="submit">Save</button>
                </div>
            </div>

        </form>
    </section>
</div>


<script xmlns:th="http://www.thymeleaf.org" th:inline="javascript">

    $(document).ready(function () {
        $('.js-example-basic-multiple').select2({
            placeholder: 'Select Roles',
            allowClear:true
        });

        setMultiSelectValue([[${dto.roleId}]],'.js-example-basic-multiple');
    });

</script>
