<div xmlns:th="http://www.thymeleaf.org" th:fragment="viewAllDetail" class="widget" id="viewAllDetail">
    <!-- Start Page Content -->
    <div class="row">
        <div class="col-12">
            <!-- table responsive -->
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Legal Entity Table</h4>
                    <!--                                    <h6 class="card-subtitle">Data table example</h6>-->
                    <div class="table-responsive m-t-40">
                        <table class="table table-striped" id="detailTable">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Edit</th>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Created Date</th>
                                <th>Enable</th>

                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="data : ${dataList}">
                                <td th:text="${data.getId()}"></td>
                                <td><a th:href="@{|addUpdate/?id=${data.getId()}|}"><i class="ti-pencil"></i></a></td>
                                <td th:text="${data.getTitle()}"></td>
                                <td th:text="${#strings.abbreviate(data.getDescription(),50)}"></td>
                                <td th:text="${#dates.format(new java.util.Date(data.getCreatedAt()), 'yyyy-MM-dd HH:mm:ss')}"></td>
                                <td th:text="${data.enable}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="common/ajaxPaging::ajaxPaging"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- End PAge Content -->
</div>
