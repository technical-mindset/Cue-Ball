<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" th:replace="layout/layout::layout(~{::section})">
    <section class="addPage__section">
        <div class="flex items-center flex-wrap justify-between gap20 mb-27">
            <h3>Add Booking</h3>
            <ul class="breadcrumbs flex items-center flex-wrap justify-start gap10">
                <li><a th:href="@{/dashboard}"><div class="text-tiny">Dashboard</div></a></li>
                <li><i class="icon-chevron-right"></i></li>
                <li><div class="text-tiny"><a th:href="@{/booking/viewAll}">List</a></div></li>
                <li><i class="icon-chevron-right"></i></li>
                <li sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" class="active" th:href="@{/booking/addUpdate}">Add</li>
            </ul>
        </div>
        <form class="form-add-product" th:object="${dto}" id="bookingForm" method="post" th:action="@{/booking/addUpdate}">
            <div class="wg-box">
                <input  th:field="*{id}" type="hidden">

                <div class="gap22 cols">
                    <fieldset class="title">
                        <div class="body-title mb-10">Title of Booking <span class="tf-color-1">*</span></div>
                        <input class="mb-10" type="text" placeholder="Enter Title" tabindex="0"  th:field="*{title}" />
                        <div th:each="err : ${#fields.errors('title')}" th:text="${err}" class="error text-danger"/>
                    </fieldset>

                    <fieldset class="customerName">
                        <div class="body-title mb-10">Customer Name <span class="tf-color-1">*</span></div>
                        <input class="mb-10" type="text" placeholder="Enter Customer Name" tabindex="0"  th:field="*{customerName}" />
                        <div th:each="err : ${#fields.errors('customerName')}" th:text="${err}" class="error text-danger"/>
                    </fieldset>
                </div>


                <div class="gap22 cols">
                    <fieldset class="email">
                        <div class="body-title mb-10">Email <span class="tf-color-1"></span></div>
                        <input class="mb-10" type="text" placeholder="Enter Email"  th:field="*{email}" />
                        <div th:each="err : ${#fields.errors('email')}" th:text="${err}" class="error text-danger"/>
                    </fieldset>

                    <fieldset class="contact">
                        <div class="body-title mb-10">Contact Number<span class="tf-color-1">*</span></div>
                        <input class="mb-10" type="text" placeholder="Enter Contact Number" tabindex="0"  th:field="*{contact}" />
                        <div th:each="err : ${#fields.errors('contact')}" th:text="${err}" class="error text-danger"/>
                    </fieldset>
                </div>


                <div class="gap22 cols">
                    <fieldset class="timeIn">
                        <div class="body-title mb-10">Time In<span class="tf-color-1">*</span></div>
                        <input class="mb-10" type="datetime-local" placeholder="Enter Time In" tabindex="0" id="timeIn"  th:field=*{timeIn} />
                        <div th:each="err : ${#fields.errors('timeIn')}" th:text="${err}" class="error text-danger"/>
                    </fieldset>

                    <fieldset class="timeOut">
                        <div class="body-title mb-10">Time Out<span class="tf-color-1">*</span></div>
                        <input class="mb-10" type="datetime-local" placeholder="Enter Time Out" tabindex="0" id="timeOut"  th:field=*{timeOut} />
                        <div th:each="err : ${#fields.errors('timeOut')}" th:text="${err}" class="error text-danger"/>
                    </fieldset>
                </div>

                <div class="gap22 cols">
                                        <fieldset class="">
                                            <div class="body-title mb-10">Room <span class="tf-color-1">*</span></div>
                                            <div class="select">
                                                <select  th:field="*{roomId}" class="mb-10">
                                                    <option th:value="0" th:selected="${roomId == null}">Choose...</option>
                                                    <option th:each="room : ${roomList}" th:value="${room.id}" th:text="${room.name}"></option>
                                                </select>
                                            </div>
                                            <div th:each="err : ${#fields.errors('roomId')}" th:text="${err}" class="error text-danger"/>
                                        </fieldset>

                                        <fieldset class="enable">
                                            <div class="body-title mb-10">Enable<span class="tf-color-1">*</span></div>
                                            <input class="mb-10 js-switch" tabindex="0" type="checkbox" data-color="#26c6da" data-secondary-color="#f62d51" th:field="*{enable}" checked>
                                            <div style="list-style: none" th:each="err : ${#fields.errors('enable')}" th:text="${err}" class="error text-danger"/>
                                        </fieldset>
                </div>

                <input type="hidden" class="form-control" th:field="*{createdAt}"/>

                <div class="">
                    <button class="tf-button w208" type="submit">Save</button>
                </div>
            </div>

        </form>

        <script th:inline="javascript">
            $("#bookingForm").submit(function (event) {

                /**  For time-in and time-out   */
                let timeIn = new Date($("#timeIn").val());
                let timeOut = new Date($("#timeOut").val());
                let now = new Date();

                if (timeIn >= timeOut) {
                    event.preventDefault();  // Stop form submission
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Time-out should be greater than the Time-in!'
                    });
                } else if (timeOut <= now) {
                    event.preventDefault();  // Stop form submission
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Time-out must be in the future!'
                    });
                } else {
                    $('#bookingForm')[0].submit();
                }
            });

        </script>

    </section>
</div>
