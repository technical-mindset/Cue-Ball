<div xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" th:fragment="viewAllDetail"
     class="widget" id="viewAllDetail">
    <!-- Start Page Content -->
    <div class="row">
        <div class="col-12">
            <!-- table responsive -->
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Table Currency </h4>
                    <div class="table-responsive m-t-40">
                        <table class="table table-striped" id="detailTable">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" >Edit</th>
                                <th>Name</th>
                                <th>Currency Code</th>
                                <th>Exchange Rate</th>
<!--                                <th>Expiry Date</th>-->

                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="data : ${dataList}">
                                <td th:text="${data.getId()}"></td>
                                <td sec:authorize="hasAnyRole('ROLE_SUPER_ADMIN')" ><a th:href="@{|addUpdate/?id=${data.getId()}|}"><i class="ti-pencil"></i></a></td>
                                <td th:text="${data.name}"></td>
                                <td th:text="${data.currencyCode}"></td>
                                <td th:text="${data.exchangePkr}"></td>
<!--                                <td th:text="${#dates.format(new java.util.Date(data.getExpireDate()), 'yyyy-MM-dd HH:mm:ss')}"></td>-->

                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="common/ajaxPaging::ajaxPaging"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- End PAge Content -->
</div>
